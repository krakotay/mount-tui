[package]
name = "mount-tui"
description = "Interactive Linux TUI for mounting local filesystems and SMB shares"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["krakotay"]
repository = "https://github.com/krakotay/mount-tui"
readme = "README.md"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto, cifs-utils"
assets = [
    ["target/release/mount-tui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mount-tui/README.md", "644"],
    ["README.ru.md", "usr/share/doc/mount-tui/README.ru.md", "644"],
    ["LICENSE", "usr/share/doc/mount-tui/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mount-tui", dest = "/usr/bin/mount-tui", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mount-tui/README.md", mode = "644", doc = true },
    { source = "README.ru.md", dest = "/usr/share/doc/mount-tui/README.ru.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/mount-tui/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
cifs-utils = "*"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.19"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
rustix = { version = "1.1.4", features = ["fs", "mount", "process"] }
